name: helper

on:
  push:
    tags: ['helper-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            helper/target
          key: helper-${{ runner.os }}-${{ hashFiles('helper/Cargo.lock') }}

      - name: Testes
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Preparar artefatos
        shell: pwsh
        run: |
          Copy-Item target/release/janja-helper.exe janja-helper.exe
          (Get-FileHash janja-helper.exe -Algorithm SHA256).Hash.ToLower() + "  janja-helper.exe" | Out-File -Encoding ascii janja-helper.exe.sha256
          Get-Item janja-helper.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: janja-helper
          path: |
            helper/janja-helper.exe
            helper/janja-helper.exe.sha256

      - name: Publicar no GitHub Release
        if: startsWith(github.ref, 'refs/tags/helper-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            helper/janja-helper.exe
            helper/janja-helper.exe.sha256
          generate_release_notes: true
