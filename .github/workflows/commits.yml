name: commits

# Recusa push e pull request com mensagem de commit fora do padrão (docs/COMMITS.md).
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci --ignore-scripts

      - name: Validar mensagens
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: npm run validate-commits -- --range "$RANGE"
