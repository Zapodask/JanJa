[package]
name = "janja-helper"
version = "0.1.2"
edition = "2024"

[dependencies]
base64 = "0.23"
directories = "6"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Console"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
